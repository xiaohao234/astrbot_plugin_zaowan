name: astrbot_plugin_zaowan
display_name: 早晚安打卡
short_desc: 无需@的早晚安打卡，统计睡眠/清醒时长并每日排名
desc: >-
  监听群消息（无需@机器人）识别早安/晚安及类似用语。早安有效时间 6-12 点，
  晚安有效时间 21 点到次日早上 6 点；自动计算睡眠时长（晚安->次日早安）与
  清醒时长（早安->当晚晚安），并输出“今早第 n 个起床 / 今晚第 n 个睡觉”排名，
  排名每日 6 点自动清零。数据实时原子落盘，重启不丢失；无第三方依赖。
version: v1.1.0
author: xiaohao234
astrbot_version: ">=3.5.0"
